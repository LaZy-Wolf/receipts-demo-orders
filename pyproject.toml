[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orders-service"
version = "2.3.0"
description = "Order management API: catalogue, customers, coupons, orders and stock."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["orders*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
